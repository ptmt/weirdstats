name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    tags: ["ios/v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight after the build checks pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          xcodebuild -version
      - name: Check distribution configuration
        run: python3 -m unittest discover -s ios/scripts/tests -v
      - name: Build for simulator
        run: |
          xcodebuild -project ios/WeirdStats.xcodeproj -scheme WeirdStats \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check Release archive
        run: |
          xcodebuild -project ios/WeirdStats.xcodeproj -scheme WeirdStats \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WeirdStats.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive

  testflight:
    name: Upload to TestFlight
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Sign, archive, and upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash ios/scripts/testflight.sh
      - name: Save debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dSYMs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/WeirdStats.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30
